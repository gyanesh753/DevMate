name: MVP verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Start isolated Supabase
        run: npx supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/devmate-supabase-start.log 2>&1
      - run: npx supabase db reset --local --yes
      - run: npm run setup:local
      - run: npm run db:test
      - run: npm run test:migrations
      - run: npm run test:integration
      - run: npm run test:queries
      - run: npx supabase db advisors --local --type security --level warn --fail-on error
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Stop isolated Supabase
        if: always()
        run: npx supabase stop --no-backup
